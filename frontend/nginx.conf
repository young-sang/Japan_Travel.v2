# 개발 때 Vite 프록시(:5173 → :8080)와 같은 구조 (D-085)
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 화면 주소(/destination, /detail/...)에서 새로고침해도 앱이 뜨도록 index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
