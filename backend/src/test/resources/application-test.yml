# 테스트 전용 DB (D-062). 운영 japan_travel 과 같은 서버의 다른 DB 이고, 없으면 접속할 때 만든다.
# schema.sql · data.sql 은 application.yml 설정 그대로 기동 때 돈다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/japan_travel_test?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
  jpa:
    show-sql: false

logging:
  level:
    com.japantravel: INFO
