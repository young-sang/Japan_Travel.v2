server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        same-site: lax
        http-only: true

spring:
  application:
    name: japan-travel-backend
  datasource:
    # foreign_keys=on 이 없으면 SQLite 는 FK 를 전부 무시한다 (ON DELETE CASCADE 가 동작하지 않음)
    url: jdbc:sqlite:${user.dir}/../data/japan_travel.db?foreign_keys=on&journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false   # 스키마 오류를 조용히 넘기지 않는다

external:
  open-meteo:
    base-url: https://api.open-meteo.com
  frankfurter:
    base-url: https://api.frankfurter.app

logging:
  level:
    com.japantravel: DEBUG
