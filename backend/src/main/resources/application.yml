server:
  port: 8080

spring:
  application:
    name: japan-travel-backend
  autoconfigure:
    # 사용자 조회는 AuthService 가 직접 한다 (UserDetailsService 없음). 이걸 빼지 않으면
    # Boot 가 인메모리 user 계정을 만들고 기동 로그에 "generated security password" 를 찍는다
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # characterEncoding=UTF-8 이 없으면 도도부현 한글 시드가 깨진다
    # Docker Compose 는 DB_URL · DB_USERNAME 으로 db 컨테이너를 가리킨다. 기본값은 로컬 개발 그대로 (D-085)
    url: ${DB_URL:jdbc:mysql://localhost:3306/japan_travel?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    # MySQL 은 Hibernate 6 이 dialect 를 자동으로 잡으므로 database-platform 을 적지 않는다
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # 여행지·축제 시드. INSERT IGNORE 라 매 기동마다 돌아도 중복되지 않는다 (D-050)
      # images.sql 은 사진이 빈 행에만 Commons 사진과 출처를 채운다 (D-063)
      # destinations.sql 은 여행지(Wikidata + ja 위키 원문 요약, D-089), festivals.sql 은 축제(ja 위키 현별 축제 분류, D-092).
      # 기본 코스 정류장(data.sql)이 둘을 이름으로 찾으므로 data.sql 보다 먼저
      # embeddings.sql 은 추천용 임베딩(D-096). 장소를 이름으로 찾으므로 두 장소 시드 다음
      data-locations: classpath:destinations.sql, classpath:festivals.sql, classpath:embeddings.sql, classpath:data.sql, classpath:images.sql
      # 없으면 schema.sql 을 플랫폼 기본 인코딩(한국어 Windows = MS949)으로 읽어
      # 도도부현 한글 시드가 깨진 채로 INSERT 된다
      encoding: UTF-8
      continue-on-error: false   # 스키마 오류를 조용히 넘기지 않는다

jwt:
  # HS256 은 32바이트 이상이어야 한다 (짧으면 기동 시 WeakKeyException). 기본값은 개발용
  secret: ${JWT_SECRET:japan-travel-dev-secret-key-0123456789abcdef}
  expiration: 24h

# AI 추천 페이지 (M4). 키가 비어 있어도 기동은 되고, 추천 요청만 실패한다
llm:
  api-key: ${LLM_API_KEY:}
  model: claude-haiku-5-5
  # 한 도도부현에서 LLM 에 넘길 여행지 후보 상한 (추정, 결정: 조건으로 추린 뒤 LLM)
  max-candidates: 150
  # 사이트 전체 하루 AI 추천 상한 — LLM 을 실제로 부른 요청만 센다 (M4-4). 로컬 확인 때 환경 변수로 낮춘다
  daily-limit: ${LLM_DAILY_LIMIT:200}

external:
  open-meteo:
    base-url: https://api.open-meteo.com
  frankfurter:
    base-url: https://api.frankfurter.app

logging:
  level:
    com.japantravel: DEBUG
